<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Makers' Marks</title>
<style>
  @font-face{font-family:'Geist Pixel';src:url(lib/fonts/GeistPixel-Square.woff2) format('woff2');font-weight:400;font-display:block}
  @font-face{font-family:'Geist Mono';src:url(lib/fonts/GeistMono-Regular.woff2) format('woff2');font-weight:400;font-display:block}
  @font-face{font-family:'Geist Mono';src:url(lib/fonts/GeistMono-Bold.woff2) format('woff2');font-weight:700;font-display:block}
  :root{
    --bg:#131315;--fg:#ececec;--dim:#8a8a90;--card:#1b1b1e;--card2:#222226;
    --shadow:#050506;          /* hard offset shadow behind boxes */
    --sh:5px;                  /* shadow offset */
    --hover:#a0a0a6;           /* hover outline */
    --title:#aa748c;
    --display:'Geist Pixel',ui-monospace,monospace;   /* headings, names, buttons */
    --body:'Geist Mono',ui-monospace,monospace;       /* small text: dates, hints   (set to var(--display) for all-pixel) */
    --st:#559ff4;
  }
  *{box-sizing:border-box;border-radius:0}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);overflow:hidden;display:flex;flex-direction:column}
  /* Geist Pixel has one weight: "bold" = a crisp 1-pixel double strike */
  h1,#status h2,.cap b,#nameForm button{font-family:var(--display);font-weight:400;text-shadow:.06em 0 0 currentColor;letter-spacing:.07em}
  header{padding:18px 16px 10px;display:flex;align-items:flex-end;gap:16px;flex:none}
  header .t{flex:1;min-width:0}
  h1{margin:0;font-size:28px;line-height:1.1;color:var(--title)}
  header p{margin:4px 0 0;color:var(--dim);font-size:13px;max-width:52ch}
  #count{color:var(--dim);font-size:12px}
  #layout{flex:1;display:flex;gap:20px;padding:0 16px;min-height:0}
  #grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 var(--sh) var(--sh) 0;align-content:start;min-width:0;touch-action:pan-y}
  .tile{display:flex;flex-direction:column;color:inherit;text-decoration:none;background:var(--card);overflow:hidden;outline:none}
  .view{position:relative;background:#000}
  .view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7;transition:opacity .8s}
  .view.ready img{opacity:0}
  .cap{padding:8px 10px 9px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}
  .cap b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cap span{color:var(--dim);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .tile.fresh .cap b{color:var(--title)}
  .empty{grid-column:1/-1;color:var(--dim);padding:40px 0}
  nav{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px 14px}
  nav button{background:var(--card2);color:var(--fg);border:0;width:40px;height:40px;font:18px var(--display);cursor:pointer}
  nav button:disabled{opacity:.3;cursor:default;box-shadow:none}
  #dots{display:flex;gap:6px}
  #dots i{width:7px;height:7px;background:#3a3a40}
  #dots i.on{background:var(--fg)}
  #gl{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}

  /* ---- station (the monitor at the installation) ---- */
  #side{display:none;width:34%;max-width:560px;flex:none;flex-direction:column;gap:18px;padding:0 var(--sh) var(--sh) 0}
  body.station #side{display:flex}
  #qr{display:flex;gap:16px;align-items:center;background:var(--card);padding:14px;box-shadow:var(--sh) var(--sh) 0 var(--shadow)}
  #qr .code{background:#fff;padding:8px;flex:none}
  #qr svg{display:block;width:112px;height:112px}
  #qr p{margin:0;color:var(--dim)}
  #qr b{display:block;color:var(--fg);font:400 17px var(--display);text-shadow:.06em 0 0 currentColor;margin-bottom:2px}
  #status{margin-top:auto;background:var(--card);box-shadow:var(--sh) var(--sh) 0 var(--shadow);padding:24px;min-height:42%;display:flex;flex-direction:column;gap:12px}
  #status[data-s=idle]{--st:#559ff4}
  #status[data-s=recording]{--st:#d8cc5f}
  #status[data-s=shaping]{--st:#d8cc5f}
  #status[data-s=naming]{--st:#a87bd8}
  #status[data-s=uploading]{--st:#5fd8a6}
  #status[data-s=done]{--st:#88bc2d}
  #status[data-s=failed]{--st:#f45d55}
  #status[data-s=offline]{--st:var(--dim)}
  #status h2{margin:0;font-size:34px;line-height:1.15;color:var(--st)}
  #status[data-s=recording] h2,#status[data-s=shaping] h2,#status[data-s=uploading] h2{animation:pulse 1.4s steps(2,jump-none) infinite}
  @keyframes pulse{50%{opacity:.55}}
  #status .msg{color:var(--dim);font-size:15px}
  #status .msg:empty{display:none}
  #nameForm{display:none;flex-direction:column;gap:10px}
  #status[data-s=naming] #nameForm{display:flex}
  #nameForm .row{display:flex;gap:8px}
  #nameInput{flex:1;min-width:0;font:22px var(--display);padding:12px 14px;border:0;background:var(--bg);color:var(--fg);outline:none;caret-color:var(--st)}
  #nameInput:focus{box-shadow:inset 0 -3px 0 var(--st)}
  #nameInput::placeholder{color:#55555c}
  #nameForm button{font-size:20px;padding:0 22px;border:0;background:var(--st);color:#0a0a0b;cursor:pointer}
  #timer{height:4px;background:#232327;overflow:hidden}
  #timer div{height:100%;background:var(--st);width:100%;transition:width 1s linear}
  #nameForm small{color:var(--dim);font-size:12px}
  #newView{display:none;height:190px;background:#000}
  #status[data-s=naming] #newView,#status[data-s=uploading] #newView,#status[data-s=done] #newView{display:block}

  /* ---- sharp shadows + hover (no fades). Pick the hover style in config.json: "hover": "outline" or "lift" ---- */
  .tile,nav button,#nameForm button{box-shadow:var(--sh) var(--sh) 0 var(--shadow)}
  .tile:focus-visible,nav button:focus-visible,#nameForm button:focus-visible{outline:2px solid var(--hover);outline-offset:0}
  @media (hover:hover){
    /* outline: a sharp light-grey outline appears, nothing moves */
    body.hover-outline .tile:hover,
    body.hover-outline nav button:not(:disabled):hover,
    body.hover-outline #nameForm button:hover{outline:2px solid var(--hover);outline-offset:0}
    /* lift: the box jumps up-left and its shadow grows, plus the outline */
    body.hover-lift .tile:hover,
    body.hover-lift nav button:not(:disabled):hover,
    body.hover-lift #nameForm button:hover{transform:translate(-3px,-3px);box-shadow:calc(var(--sh) + 3px) calc(var(--sh) + 3px) 0 var(--shadow);outline:2px solid var(--hover);outline-offset:0}
  }
  /* pressing: the box drops onto its shadow */
  .tile:active,nav button:not(:disabled):active,#nameForm button:active{transform:translate(var(--sh),var(--sh));box-shadow:none}
  @media (max-width:760px){ header{padding-top:22px} h1{font-size:24px} #layout{gap:0} #grid{gap:10px}
    .cap{flex-direction:column;gap:1px;padding:7px 9px 8px} .cap b{font-size:14px} .cap span{font-size:11px} }
</style>
</head>
<body>
<header>
  <div class="t">
    <h1 id="title">Makers' Marks</h1>
    <p id="sub"></p>
  </div>
  <div id="count"></div>
</header>
<div id="layout">
  <main id="grid"></main>
  <aside id="side">
    <div id="qr"><div class="code" id="qrcode"></div><p>&lt;-- scan for mobile view</p></div>
    <section id="status" data-s="idle" aria-live="polite">
      <h2 id="stHead">Name your thing!</h2>
      <div class="msg" id="stMsg"></div>
      <div id="newView"></div>
      <form id="nameForm" autocomplete="off">
        <div class="row"><input id="nameInput" maxlength="40" placeholder="Type a name..." aria-label="Painting name"><button>Save</button></div>
        <div id="timer"><div></div></div>
        <small>Names appear publicly in the online gallery.</small>
      </form>
    </section>
  </aside>
</div>
<nav><button id="prev" aria-label="Previous page">&#8249;</button><div id="dots"></div><button id="next" aria-label="Next page">&#8250;</button></nav>
<canvas id="gl"></canvas>

<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { buildPreview } from './lib/preview.js';
import { autoQuality } from './lib/perf.js';
import qrcode from './lib/qrcode.mjs';

const q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const bust = () => '?v=' + Date.now();
let cfg = {};
try { cfg = await (await fetch('config.json' + bust())).json(); } catch {}
if (cfg.title) { $('title').textContent = cfg.title; document.title = cfg.title; }
if (cfg.subtitle) $('sub').textContent = cfg.subtitle;
// hover style: config.json "hover": "outline" | "lift"   (try one without editing: ?hover=lift)
document.body.classList.add('hover-' + (q.get('hover') || cfg.hover || 'outline'));

// The station (monitor) is this page opened on the installation computer.
// It talks to TouchDesigner's Web Server DAT for recording status + naming.
const STATION_URL = (q.get('station') && q.get('station') !== '1' ? q.get('station') : null) || cfg.stationUrl || 'http://localhost:9980';
const tryStation = q.has('station') || ['localhost', '127.0.0.1'].includes(location.hostname);

// ---------------- one WebGL canvas draws every tile ----------------
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, alpha: true, powerPreference: 'high-performance' });
const quality = autoQuality(renderer, { max: Math.min(devicePixelRatio, 1.25) });
renderer.setClearColor(0x000000, 0);
renderer.autoClear = false;
const hemi = () => { const g = new THREE.Group(); g.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.6));
  const k = new THREE.DirectionalLight(0xffffff, 1.8); k.position.set(1, 2, 3); g.add(k);
  const r = new THREE.DirectionalLight(0x88aaff, 1); r.position.set(-2, -1, -3); g.add(r); return g; };

const cache = new Map();          // id -> Promise<{scene, camera, spin, lit}>
const views = [];                 // [{el, id}] currently on screen
function sceneFor(entry) {
  if (!cache.has(entry.id)) cache.set(entry.id, buildPreview(entry).then(p => {
    const scene = new THREE.Scene();
    const spin = new THREE.Group(); spin.add(p.object); scene.add(spin);
    if (p.lit) scene.add(hemi());
    const camera = new THREE.PerspectiveCamera(35, 1, p.radius * 0.02, p.radius * 40);
    const d = p.radius / Math.sin(THREE.MathUtils.degToRad(35 / 2)) * 1.02;
    const el = THREE.MathUtils.degToRad(24), az = THREE.MathUtils.degToRad(45);   // 3/4 view
    camera.position.set(Math.sin(az) * Math.cos(el) * d, Math.sin(el) * d, Math.cos(az) * Math.cos(el) * d);
    camera.lookAt(0, 0, 0);
    return { scene, camera, spin, lit: p.lit, phase: Math.random() * 6 };
  }).catch(() => null));
  return cache.get(entry.id);
}
function watch(el, entry) {
  const v = { el, id: entry.id, s: null };
  views.push(v);
  sceneFor(entry).then(s => { v.s = s; if (s) el.classList.add('ready'); });
  return v;
}

function resize() { renderer.setSize(innerWidth, innerHeight, false); }
addEventListener('resize', () => { resize(); layout(); });
resize();

renderer.setAnimationLoop(t => {
  quality(t);
  renderer.setScissorTest(false); renderer.clear();
  renderer.setScissorTest(true);
  const H = innerHeight;
  for (const v of views) {
    if (!v.s || !v.el.isConnected) continue;
    const r = v.el.getBoundingClientRect();
    if (r.width < 2 || r.bottom < 0 || r.top > H || r.right < 0 || r.left > innerWidth) continue;
    const x = r.left, y = H - r.bottom;
    renderer.setViewport(x, y, r.width, r.height); renderer.setScissor(x, y, r.width, r.height);
    renderer.setClearColor(0x000000, 1); renderer.clear();
    v.s.camera.aspect = r.width / r.height; v.s.camera.updateProjectionMatrix();
    v.s.spin.rotation.y = t / 1000 * 0.35 + v.s.phase;
    renderer.outputColorSpace = v.s.lit ? THREE.SRGBColorSpace : THREE.LinearSRGBColorSpace;
    renderer.render(v.s.scene, v.s.camera);
  }
  renderer.setClearColor(0x000000, 0);
});

// ---------------- gallery + pages ----------------
let list = [], page = 0, perPage = 6, listKey = '', lastInput = Date.now();
const station = { on: false };

async function loadList() {
  try { const l = await (await fetch('paintings/index.json' + bust())).json(); return l.sort((a, b) => (b.date || '').localeCompare(a.date || '')); }
  catch { return list; }
}
function pages() { return Math.max(1, Math.ceil(list.length / perPage)); }

function layout() {
  // how many rows of 2 fit on screen
  const grid = $('grid'), gw = grid.clientWidth || innerWidth - 32;
  const tileW = (gw - 12) / 2, CAP = (innerWidth < 760 ? 46 : 38) + 12;
  const avail = innerHeight - grid.getBoundingClientRect().top - 66;
  const minA = innerWidth < 760 ? 0.75 : 0.5, maxA = innerWidth < 760 ? 1 : 0.8;   // view height / width
  const rows = Math.max(1, Math.floor((avail + 12) / (tileW * minA + CAP)));
  const viewH = Math.max(80, Math.min(tileW * maxA, (avail + 12) / rows - CAP));
  const np = rows * 2;
  grid.style.setProperty('--vh', viewH + 'px');
  if (np !== perPage) { perPage = np; page = Math.min(page, pages() - 1); render(); }
  else grid.querySelectorAll('.view').forEach(v => v.style.height = viewH + 'px');
}

function fmt(d) {   // DD.MM.YY HH:MM, 24h
  const x = new Date(d); if (isNaN(x)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${p(x.getDate())}.${p(x.getMonth() + 1)}.${p(x.getFullYear() % 100)} ${p(x.getHours())}:${p(x.getMinutes())}`;
}
function viewerHref(p) {
  let h = (p.kind === 'layers' ? 'layers.html' : 'view.html') + '?p=' + encodeURIComponent(p.id);
  if (station.on) h += '&return=90&station=' + encodeURIComponent(STATION_URL);
  return h;
}

function render() {
  const grid = $('grid');
  views.length = 0; grid.innerHTML = '';
  $('count').textContent = list.length ? `${list.length} painting${list.length > 1 ? 's' : ''}` : '';
  if (!list.length) grid.innerHTML = '<div class="empty">No paintings yet.</div>';
  const vh = grid.style.getPropertyValue('--vh') || '200px';
  list.slice(page * perPage, page * perPage + perPage).forEach((p, i) => {
    const n = list.length - (page * perPage + i);
    const a = document.createElement('a');
    a.className = 'tile' + (page === 0 && i === 0 && Date.now() - new Date(p.date) < 36e5 ? ' fresh' : '');
    a.href = viewerHref(p);
    a.innerHTML = '<div class="view"><img alt=""></div><div class="cap"><b></b><span></span></div>';
    const view = a.querySelector('.view'); view.style.height = vh;
    const img = a.querySelector('img');
    img.src = `paintings/${p.id}/${p.thumb || 'thumb.jpg'}`; img.onerror = () => img.remove();
    a.querySelector('b').textContent = p.title || `No. ${n}`;
    a.querySelector('.cap span').textContent = fmt(p.date);
    grid.appendChild(a);
    watch(view, p);
  });
  if (station.view) views.push(station.view);
  const dots = $('dots'); dots.innerHTML = '';
  for (let i = 0; i < pages(); i++) { const d = document.createElement('i'); if (i === page) d.className = 'on'; dots.appendChild(d); }
  $('prev').disabled = page === 0; $('next').disabled = page >= pages() - 1;
  document.querySelector('nav').style.visibility = pages() > 1 ? 'visible' : 'hidden';
}
function go(d) { const np = Math.min(pages() - 1, Math.max(0, page + d)); if (np !== page) { page = np; render(); } }
$('prev').onclick = () => { lastInput = Date.now(); go(-1); };
$('next').onclick = () => { lastInput = Date.now(); go(1); };
addEventListener('keydown', e => {
  lastInput = Date.now();
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') go(1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(-1);
});
let tx = null;
$('grid').addEventListener('touchstart', e => { tx = e.touches[0].clientX; lastInput = Date.now(); }, { passive: true });
$('grid').addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); tx = null; });
addEventListener('pointermove', () => lastInput = Date.now());

async function refresh() {
  const l = await loadList();
  const key = JSON.stringify(l.map(p => [p.id, p.title]));
  if (key === listKey) return;
  const grew = l.length > list.length && listKey !== '';
  list = l; listKey = key;
  if (grew) page = 0;
  render();
}
list = await loadList(); listKey = JSON.stringify(list.map(p => [p.id, p.title]));
render(); layout();
setInterval(refresh, 5000);

// ---------------- station: QR, status, naming ----------------
if (tryStation) initStation();

async function initStation() {
  const url = cfg.galleryUrl || location.href.replace(/index\.html.*$/, '').replace(/\?.*$/, '');
  const code = qrcode(0, 'M'); code.addData(url); code.make();
  $('qrcode').innerHTML = code.createSvgTag({ cellSize: 4, margin: 0, scalable: true });

  const S = $('status'), form = $('nameForm'), input = $('nameInput');
  let last = null, reachable = false, newId = null, submitted = false;

  const TEXT = {
    idle:      ['ready',     cfg.idleHead || 'press B1 to record!', cfg.idleText || 'Press B1 to start a painting. Press it again to finish.'],
    recording: ['recording', 'recording...', ''],
    shaping:   ['shaping',   'processing...'],
    naming:    ['name it',   'Name your creation!', 'Type a name and press Enter.'],
    uploading: ['uploading', 'Uploading...', ''],
    done:      ['done',      'In the gallery', 'It will show up on phones in about a minute.'],
    failed:    ['saved',     'Saved on this computer', 'The upload will be retried.'],
    offline:   ['offline',   'Station offline', 'Waiting for TouchDesigner...']
  };

  async function poll() {
    let s;
    try {
      const r = await fetch(STATION_URL + '/api/status', { cache: 'no-store', signal: AbortSignal.timeout(1500) });
      s = await r.json();
      if (!reachable) { reachable = true; station.on = true; document.body.classList.add('station'); layout(); render(); }
    } catch {
      if (!reachable) return;          // never reached TouchDesigner: stay a normal gallery page
      s = { state: 'offline' };
    }
    show(s);
  }

  function show(s) {
    const st = TEXT[s.state] ? s.state : 'idle';
    if (st === 'recording' && last !== 'recording' && page !== 0) { page = 0; render(); }   // new take: show the newest page
    S.dataset.s = st;
    const [label, head, msg] = TEXT[st];
    let h = head, m = msg || '';
    if (st === 'recording') {
      const secs = Math.max(0, Math.round(s.elapsed || 0));
      m = `${s.frames || 0} frames · ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
    }
    if ((st === 'uploading' || st === 'done') && s.title) h = (st === 'done' ? '' : 'Uploading ') + `“${s.title}”` + (st === 'done' ? ' is in the gallery' : '...');
    if (st === 'failed' && s.message) m = 'The upload will be retried. (' + s.message.slice(0, 80) + ')';
    $('stHead').textContent = h; $('stMsg').textContent = m;

    if (st === 'naming') {
      if (last !== 'naming') { input.value = ''; submitted = false; setTimeout(() => input.focus(), 50); }
      const total = s.timeout || 60, left = Math.max(0, s.remaining ?? total);
      $('timer').firstElementChild.style.width = (100 * left / total) + '%';
    }
    // the new painting spinning inside the block
    if (s.id && ['naming', 'uploading', 'done'].includes(st) && newId !== s.id) {
      newId = s.id;
      const entry = { id: s.id, kind: s.kind };
      cache.delete(s.id);
      station.view = { el: $('newView'), id: s.id, s: null };
      sceneFor(entry).then(sc => { if (station.view && station.view.id === s.id) { station.view.s = sc; } });
      if (!views.includes(station.view)) views.push(station.view);
    }
    if (!['naming', 'uploading', 'done'].includes(st) && station.view) {
      const i = views.indexOf(station.view); if (i >= 0) views.splice(i, 1);
      station.view = null; newId = null;
    }
    last = st;
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (submitted) return;
    const name = input.value.trim().replace(/\s+/g, ' ').slice(0, 40);
    submitted = true;
    try {
      // text/plain keeps this a "simple" request (no CORS preflight)
      await fetch(STATION_URL + '/api/name', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ name }) });
    } catch { submitted = false; }
    poll();
  });

  // the monitor stays on the newest page: if a visitor flips away, come back after 30 s idle
  setInterval(() => {
    if (!station.on || page === 0 || Date.now() - lastInput < 30000) return;
    page = 0; render();
  }, 2000);

  poll(); setInterval(poll, 1000);
}
</script>
</body>
</html>
