<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound Paintings</title>
<style>
  :root{--bg:#0a0a0b;--fg:#ececec;--dim:#8a8a90;--card:#141416;--line:#232327}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,sans-serif}
  header{padding:40px 16px 24px;max-width:1100px;margin:0 auto}
  h1{margin:0 0 6px;font-size:28px;font-weight:600;letter-spacing:-.01em}
  header p{margin:0;color:var(--dim);max-width:46ch}
  .count{margin-top:14px;color:var(--dim);font-size:13px}
  main{max-width:1100px;margin:0 auto;padding:0 16px 48px;display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
  @media(min-width:700px){main{grid-template-columns:repeat(3,1fr);gap:16px}}
  @media(min-width:1000px){main{grid-template-columns:repeat(4,1fr)}}
  a.card{display:block;color:inherit;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:border-color .2s,transform .2s}
  a.card:hover{border-color:#44444a;transform:translateY(-2px)}
  a.card.hi{border-color:#e9e9e9}
  .thumb{aspect-ratio:1;background:#000 center/cover no-repeat}
  .meta{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
  .meta b{font-weight:500;font-size:14px}
  .meta span{color:var(--dim);font-size:12px;white-space:nowrap}
  .new{font-size:11px;color:#000;background:#e9e9e9;border-radius:8px;padding:1px 6px;margin-left:6px;vertical-align:1px}
  .empty{grid-column:1/-1;color:var(--dim);padding:40px 0}
</style>
</head>
<body>
<header>
  <h1 id="title">Sound Paintings</h1>
  <p id="sub"></p>
  <div class="count" id="count"></div>
</header>
<main id="grid"></main>
<script>
(async () => {
  const bust = '?v=' + Date.now();          // GitHub Pages caches ~10 min; this always gets the latest list
  let cfg = {}, list = [];
  try { cfg = await (await fetch('config.json' + bust)).json(); } catch {}
  try { list = await (await fetch('paintings/index.json' + bust)).json(); } catch {}
  if (cfg.title) { document.getElementById('title').textContent = cfg.title; document.title = cfg.title; }
  if (cfg.subtitle) document.getElementById('sub').textContent = cfg.subtitle;

  list.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const grid = document.getElementById('grid');
  document.getElementById('count').textContent = list.length ? `${list.length} painting${list.length > 1 ? 's' : ''}` : '';
  if (!list.length) { grid.innerHTML = '<div class="empty">No paintings yet. Check back soon.</div>'; return; }

  const hi = location.hash.slice(1);
  const fmt = d => { const x = new Date(d); return isNaN(x) ? '' : x.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); };
  list.forEach((p, i) => {
    const a = document.createElement('a');
    a.className = 'card' + ((hi && p.id === hi) || (hi === 'latest' && i === 0) ? ' hi' : '');
    a.href = (p.kind === 'layers' ? 'layers.html' : 'view.html') + '?p=' + encodeURIComponent(p.id);
    const n = list.length - i;
    a.innerHTML = `<div class="thumb"></div><div class="meta"><b></b><span></span></div>`;
    a.querySelector('.thumb').style.backgroundImage = `url("paintings/${p.id}/${p.thumb || 'thumb.jpg'}")`;
    a.querySelector('b').textContent = p.title || `No. ${n}`;
    if (i === 0) a.querySelector('b').insertAdjacentHTML('beforeend', '<span class="new">newest</span>');
    a.querySelector('.meta > span').textContent = fmt(p.date);
    grid.appendChild(a);
  });
})();
</script>
</body>
</html>
